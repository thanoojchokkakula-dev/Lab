[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lab-magic"
version = "0.1.0"
description = "Load Python and SQL programs into Jupyter Notebook cells"
requires-python = ">=3.8"
dependencies = ["ipython"]

[tool.setuptools]
py-modules = ["lab"]

[tool.setuptools.packages.find]
include = ["lab_magic*"]
