[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lab-ml-programs"
version = "0.3.0"
description = "Browse machine-learning lab programs from the Lab repository"
requires-python = ">=3.7"

[tool.setuptools]
py-modules = ["lab"]

[tool.setuptools.packages.find]
include = ["dva*", "lab_magic*", "ml*"]

[tool.setuptools.package-data]
dva = ["*.txt"]
